
name: BuildLead AI - London Lead Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: lead-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Check planning data source
        run: |
          mkdir -p leads
          echo "BuildLead AI scan started at $(date -u +%FT%TZ)" >> leads/scan-log.txt
          echo "Planning data connector needs to be configured before real leads can be collected." >> leads/scan-log.txt

      - name: Save scan log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads/scan-log.txt
          git diff --cached --quiet || git commit -m "Update lead scan log"
          git push
