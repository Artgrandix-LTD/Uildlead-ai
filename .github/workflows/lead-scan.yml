
name: BuildLead AI - London Lead Scanner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/scan_planning.py"
      - ".github/workflows/lead-scan.yml"
  schedule:
    - cron: "17 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: lead-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan public planning data
        run: python scripts/scan_planning.py

      - name: Save scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads/latest-leads.json leads/scan-log.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update London planning signals"

          # Website edits can land while the long scan is running. Rebase the
          # generated data commit onto the latest main before pushing, without
          # force-pushing or overwriting anyone else's changes.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another commit (attempt $attempt/5); retrying."
            sleep $((attempt * 2))
          done
          echo "Could not publish scan results after 5 attempts." >&2
          exit 1
