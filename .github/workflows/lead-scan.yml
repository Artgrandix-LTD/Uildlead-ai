
name: BuildLead AI - London Lead Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: lead-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan public planning data
        run: python scripts/scan_planning.py

      - name: Save scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads/latest-leads.json leads/scan-log.txt
          git diff --cached --quiet || git commit -m "Update London planning signals"
          git push
